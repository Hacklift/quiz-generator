name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      JWT_SECRET: ci-test-secret
      JWT_ALGORITHM: HS256
      FERNET_KEY: x8W0Nl1epNQR7wUiCPXFI9GOs9_z1p9tw6Uxk4KJnzM=
      MONGO_URI: mongodb://localhost:27017
      DB_NAME: quizApp_test_db
      REDIS_URL: redis://localhost:6379/0
      SHARE_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      EMAIL_SENDER: ci@example.com
      EMAIL_PASSWORD: ci-password
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: "587"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: server
        run: |
          # Same pipenv as the Dockerfile: its --deploy hash check must match.
          pip install pipenv==2023.12.1
          pipenv install --system --dev --deploy
      - name: Run pytest
        run: python -m pytest server/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run jest
        run: pnpm test --ci
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://quiz-api.campilot.org
          NEXT_PUBLIC_SSR_API_BASE_URL: http://server:8000
        run: pnpm run build
